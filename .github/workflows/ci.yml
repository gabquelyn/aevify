name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same Docker workflow you use locally (see README.md).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Let the container user (uid 1000) write to the checkout
        run: chmod -R a+rwX .

      - name: Build the dev image
        run: docker compose build deps

      - name: Install dependencies
        run: docker compose run --rm -T deps

      - name: Typecheck
        run: docker compose run --rm -T -w /app contracts npm run typecheck

      - name: Contract tests
        run: docker compose run --rm -T contracts npm test

      - name: Build
        run: docker compose run --rm -T -w /app contracts npm run build

      - name: Build the production web image
        run: docker compose build web-prod
