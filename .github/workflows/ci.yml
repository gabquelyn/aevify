name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same Docker workflow you use locally (see README.md).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Let the container user (uid 1000) write to the checkout
        run: chmod -R a+rwX .

      - name: Build the dev image
        run: docker compose build deps

      - name: Install dependencies
        run: docker compose run --rm -T deps

      - name: Typecheck
        run: docker compose run --rm -T -w /app contracts npm run typecheck

      - name: Tests (contracts + web API)
        run: docker compose run --rm -T -w /app contracts npm test

      - name: Deployable bytecode has no opcodes Aevum rejects (production profile)
        run: docker compose run --rm -T contracts npm run check:evm

      - name: End-to-end (real contract on a local chain + the API)
        run: |
          docker compose up -d chain
          for i in $(seq 1 30); do
            curl -sf -X POST http://localhost:8545 -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' && break
            sleep 2
          done
          docker compose run --rm -T contracts npm run deploy:local
          docker compose run --rm -T -w /app/apps/web -e E2E_RPC_URL=http://chain:8545 contracts npm run test:e2e
          docker compose run --rm -T -w /app/apps/listener -e E2E_RPC_URL=http://chain:8545 contracts npm run test:e2e

      - name: Build
        run: docker compose run --rm -T -w /app contracts npm run build

      - name: Build the production images
        run: docker compose build web-prod listener-prod
